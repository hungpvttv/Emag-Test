<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Du lịch Thanh Hóa: Thắng lớn mùa hè, lặng lẽ mùa đông</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Lora:ital,wght@0,500;0,700;1,500&display=swap">
<style>
:root{--ink:#1F2733;--paper:#FAF8F3;--sea:#2E6B7A;--acc:#D2693C;--card:#fff;--muted:#586470;--line:#E4DFD3;
--serif:'Lora',Georgia,serif;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EAF0F2;--paper:#0F1A20;--card:#16262E;--muted:#9DB0B8;--line:#27404B;--sea:#6FB3C4}}
:root[data-theme="dark"]{--ink:#EAF0F2;--paper:#0F1A20;--card:#16262E;--muted:#9DB0B8;--line:#27404B;--sea:#6FB3C4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5em}
p{margin:0 0 1em}a{color:var(--sea)}
img{display:block;max-width:100%;height:auto}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:var(--acc);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero{background:#0E1B22;text-align:center}
.hero img{margin:0 auto;width:100%;max-height:100svh;object-fit:contain}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.sec{padding:48px 0}
.wide{max-width:1100px;margin:0 auto;padding:0 20px}
.paper{background:#fff;border-radius:12px;overflow:hidden}
.paper img{width:100%}
.sub{background:#fff;padding:26px 20px 14px;margin-top:40px;text-align:center}
.sub img{margin:0 auto;max-width:560px;width:100%}
figure{margin:0}
figcaption{font-size:14px;color:var(--muted);padding-top:8px}
.photo img{border-radius:12px;width:100%}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:22px 0;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.stat b{font:700 clamp(30px,6vw,40px)/1 var(--serif);color:var(--acc)}
.stat span{color:var(--muted);flex:1;min-width:200px}
.lead{font-family:var(--serif);font-size:clamp(20px,3.8vw,26px);line-height:1.45}

.gap{background:#1F2733;color:#F4F1EA;padding:56px 20px;margin-top:20px}
.gap>div{max-width:900px;margin:0 auto}.gap h2{color:#fff}
.occ{margin:26px 0}
.occ .row{display:grid;grid-template-columns:78px 1fr 52px;gap:12px;align-items:center;margin:12px 0;font-size:15px}
.occ .track{height:30px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.occ .fill{height:100%;width:0;border-radius:8px;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.hot{background:var(--acc)}.cold{background:#8FB6C1}
.occ b{font:700 20px var(--serif);text-align:right}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:14px 0 6px}
.months i{height:44px;border-radius:6px;background:rgba(255,255,255,.14);font:500 12px/44px var(--sans);text-align:center;font-style:normal;color:rgba(255,255,255,.7);transition:background .5s}
.months i.on{background:var(--acc);color:#fff}
.cap{font-size:14px;color:rgba(255,255,255,.7)}

.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cols h3{font-size:21px}
.peak{border-left:4px solid var(--acc);padding-left:16px}.off{border-left:4px solid var(--sea);padding-left:16px}

.dest{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:22px 0}
.d{border-radius:12px;padding:16px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sea)}
.d b{display:block;font:700 18px/1.3 var(--serif)}.d span{font-size:14px;color:var(--muted)}

.tl{list-style:none;margin:26px 0 0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.tl li{position:relative;margin:0 0 28px}
.tl li::before{content:"";position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--sea);border:3px solid var(--paper)}
.tl li.big::before{background:var(--acc)}
.tl time{font-size:14px;color:var(--muted);display:block}
.tl b{font:700 19px var(--serif)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 14px}
.tabs button{font:500 14px var(--sans);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:#fff}
.tabs button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.voice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.voice p{font:italic 500 20px/1.5 var(--serif)}.voice small{color:var(--muted)}
.end{text-align:center}.end .lead{max-width:26em;margin:0 auto 20px}
footer{padding:32px 20px 56px;text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:520px){.occ .row{grid-template-columns:64px 1fr 46px}.months i{font-size:11px}}
@media (prefers-reduced-motion:reduce){.occ .fill{transition:none}}

body{overflow-x:clip}
.hero{position:sticky;top:0;z-index:0;height:100svh;display:flex;align-items:center;overflow:hidden}
.hero img{will-change:transform,opacity}
main,footer{position:relative;z-index:1;background:var(--paper)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
.band{position:relative;width:100vw;margin:34px 0 34px calc(50% - 50vw);height:75svh;min-height:380px;overflow:hidden;background:#000}
.band img{position:absolute;left:0;top:-15%;width:100%;height:130%;object-fit:cover;border-radius:0;will-change:transform}
.band figcaption{position:absolute;left:0;right:0;bottom:0;padding:70px 24px 22px;color:#fff;font:500 18px var(--serif);background:linear-gradient(transparent,rgba(0,0,0,.65))}
.stage{position:relative}
.stage-bg{position:sticky;top:0;height:100svh;overflow:hidden;z-index:0;background:#000}
.stage-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s;border-radius:0}
.stage-bg img.on{opacity:1}
.stage-bg::after{content:"";position:absolute;inset:0;background:rgba(10,20,26,.3)}
.steps{position:relative;z-index:1;margin-top:-100svh;padding-bottom:12svh}
.step{min-height:100svh;display:flex;align-items:center;padding:0 20px}
.step .card{max-width:500px;background:var(--card);border-radius:14px;padding:26px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.step:nth-child(even) .card{margin-left:auto}
.step time{font-size:14px;color:var(--muted);display:block}
.step h3{font-size:22px;margin:.2em 0 .5em}
.step p{margin:0}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.stage-bg img{transition:none}}

.hero{display:block;position:sticky;overflow:hidden;background:#0E1B22}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.hbg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(28px) brightness(.8) saturate(1.2)}
.hero .hfg{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;object-fit:contain}
.hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;color:#fff;font:500 14px var(--sans);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hint::after{content:"";display:block;width:10px;height:10px;margin:6px auto 0;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg)}
@media (min-aspect-ratio:4/3){.hero .hfg{object-fit:cover;object-position:50% 25%}.hbg{display:none}}
</style></head>
<body><div id="bar"></div><div id="app"></div>
<script>
(function(){
var app=document.getElementById('app'),bar=document.getElementById('bar');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function img(o,a){return o&&o.image?'<img '+(a||'loading="lazy"')+' src="'+esc(o.image)+'" alt="'+esc(o.alt)+'">':'';}
function fig(o,cls){return '<figure class="'+cls+'">'+img(o)+(o.caption?'<figcaption>'+esc(o.caption)+'</figcaption>':'')+'</figure>';}
function render(d){
  var a=d.part1,g=d.gap,e=d.effects,b=d.part2,c=d.part3,v=d.voices,s=[];
  var ims=[],ix=c.steps.map(function(t){var k=-1;ims.forEach(function(x,i){if(x.image===t.image)k=i;});if(k<0){ims.push(t);k=ims.length-1;}return k;});
  s.push('<header class="hero"><h1 class="sr">'+esc(d.meta.title)+'</h1><div class="hbg" id="hbg" aria-hidden="true"></div>'+img(d.hero,'class="hfg"')+'<div class="hint">Cuộn xuống</div></header><main>');
  s.push('<div class="wide sec" style="padding-bottom:0"><figure class="photo">'+img(d.sapo)+'</figure></div>');
  s.push('<div class="sub">'+img(a.subtitle)+'</div><div class="wrap sec"><p class="lead">'+esc(a.lead)+'</p><figure class="paper" style="margin:24px 0">'+img(a.infographic)+'</figure>');
  s.push('<div class="stat"><b>'+esc(a.stat.number)+'</b><span>'+esc(a.stat.text)+'</span></div><div class="two">'+(a.photos||[]).map(function(p){return fig(p,'photo');}).join('')+'</div></div>');
  s.push('<section class="gap" id="gap"><div><h2>'+esc(g.title)+'</h2><p>'+esc(g.text)+'</p><div class="months" id="months"></div><p class="cap">'+esc(g.months_note)+'</p><div class="occ"><div class="row"><span>'+esc(g.hot_label)+'</span><div class="track"><div class="fill hot" data-w="'+esc(g.hot_value)+'"></div></div><b>'+esc(g.hot_value)+'%</b></div><div class="row"><span>'+esc(g.cold_label)+'</span><div class="track"><div class="fill cold" data-w="'+esc(g.cold_value)+'"></div></div><b>'+esc(g.cold_value)+'%</b></div></div><p class="cap">'+esc(g.note)+'</p></div></section>');
  s.push('<div class="wrap sec"><h2>'+esc(e.title)+'</h2><div class="cols">'+(e.cols||[]).map(function(x,i){return '<div class="'+(i?'off':'peak')+'"><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div>';}).join('')+'</div></div>');
  s.push('<div class="sub" style="margin-top:0">'+img(b.subtitle)+'</div><div class="wrap sec"><p>'+esc(b.intro)+'</p>'+fig(b.band1,'band')+'<div class="dest">'+(b.destinations||[]).map(function(x){return '<div class="d"><b>'+esc(x.name)+'</b><span>'+esc(x.desc)+'</span></div>';}).join('')+'</div>'+fig(b.band2,'band')+'<p>'+esc(b.outro)+'</p></div>');
  s.push('<div class="sub" style="margin-top:0">'+img(c.subtitle)+'</div><section class="stage"><div class="stage-bg">'+ims.map(function(x,i){return img(x,'class="'+(i?'':'on')+'"');}).join('')+'</div><div class="steps">'+c.steps.map(function(t,i){return '<div class="step" data-img="'+ix[i]+'"><div class="card"><time>'+esc(t.time)+'</time><h3>'+esc(t.title)+'</h3><p>'+esc(t.text)+'</p></div></div>';}).join('')+'</div></section>');
  s.push('<div class="wrap sec"><figure class="paper" style="margin:0 0 30px">'+img(c.festival)+'</figure><h3>'+esc(c.tours_title)+'</h3><figure class="paper">'+img(c.tours)+'</figure><p style="margin-top:14px">'+esc(c.tours_note)+'</p></div>');
  s.push('<div class="wrap sec" style="padding-top:0"><h2>'+esc(v.title)+'</h2><div class="tabs" role="tablist" id="tabs">'+v.items.map(function(x,i){return '<button role="tab" aria-selected="'+(i==0)+'" data-i="'+i+'">'+esc(x.tab)+'</button>';}).join('')+'</div><div class="voice" id="voice"></div></div>');
  s.push('<div class="wrap sec end"><p class="lead">'+esc(d.closing.lead)+'</p><p><a href="'+esc(d.meta.source_url)+'" target="_blank" rel="noopener">'+esc(d.meta.source_text)+'</a></p></div></main><footer>'+esc(d.meta.footer)+'</footer>');
  app.innerHTML=s.join('');document.title=d.meta.title;
}
function init(d){
  var rm=matchMedia('(prefers-reduced-motion:reduce)').matches,hi=document.querySelector('.hfg'),hb=document.getElementById('hbg'),bands=document.querySelectorAll('.band'),tick=false;
  if(hb&&hi)hb.style.backgroundImage='url("'+hi.src+'")';
  function frame(){tick=false;var h=document.documentElement.scrollHeight-innerHeight;bar.style.width=(h>0?scrollY/h*100:0)+'%';if(rm||!hi)return;
    var p=Math.min(1,scrollY/innerHeight);hi.style.transform='scale('+(1+p*.14)+')';hi.style.opacity=1-p*.8;
    bands.forEach(function(x){var r=x.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;x.firstElementChild.style.transform='translateY('+(-(r.top+r.height/2-innerHeight/2)/innerHeight*50)+'px)';});}
  addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(frame);}},{passive:true});
  var m=document.getElementById('months'),g=d.gap;
  for(var i=1;i<=12;i++){var e=document.createElement('i');e.textContent='T'+i;m.appendChild(e);}
  var done=false;
  function play(){if(done)return;done=true;for(var i=0;i<12;i++){(function(el,n){setTimeout(function(){if(n>=+g.hot_from&&n<=+g.hot_to)el.classList.add('on');},n*70);})(m.children[i],i+1);}
    document.querySelectorAll('.fill').forEach(function(f){f.style.width=f.dataset.w+'%';});}
  var V=d.voices.items,box=document.getElementById('voice'),tabs=document.getElementById('tabs');
  function show(i){box.innerHTML='';var p=document.createElement('p'),s=document.createElement('small');p.textContent=V[i].text;s.textContent=V[i].author;box.appendChild(p);box.appendChild(s);
    tabs.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.i==i);});}
  tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(+b.dataset.i);});show(0);
  if('IntersectionObserver' in window){
    new IntersectionObserver(function(es,o){es.forEach(function(x){if(x.isIntersecting){play();o.disconnect();}});},{threshold:.35}).observe(document.getElementById('gap'));
    var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{threshold:.12});
    document.querySelectorAll('.photo,.paper,.stat,.dest .d,.cols>div,.voice').forEach(function(x){x.classList.add('rv');io.observe(x);});
    var si=document.querySelectorAll('.stage-bg img');
    var so=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){var k=+x.target.dataset.img;si.forEach(function(im,j){im.classList.toggle('on',j===k);});}});},{threshold:.55});
    document.querySelectorAll('.step').forEach(function(x){so.observe(x);});
  }else play();
  frame();
}
fetch('content/site.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){render(d);init(d);}).catch(function(){app.innerHTML='<p style="padding:40px 20px;text-align:center">Không tải được nội dung (content/site.json). Hãy mở trang qua đường dẫn github.io, không mở trực tiếp file trên máy.</p>';});
})();
</script></body></html>
